<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>个人主页</title>
		<link rel="stylesheet" href="assets/style.css" />
		<script src="assets/index.js" defer></script>
	</head>

	<body>
		<nav>
			<span class="nav-pill" aria-hidden="true"></span>
			<button type="button" data-page="home" class="active" aria-current="page">
				首页
			</button>
			<button type="button" data-page="about">关于</button>
			<button type="button" data-page="history">历程</button>
			<button type="button" data-page="sites">站点</button>
			<button
				type="button"
				id="music-toggle"
				aria-label="背景音乐"
				aria-pressed="false"
			>
				<img src="assets/images/play.svg" alt="" />
			</button>
			<button
				type="button"
				id="darkMode"
				aria-label="深色主题"
				aria-pressed="false"
			>
				<img src="assets/images/sun.svg" alt="" />
			</button>
		</nav>

		<main class="scrollbar">
			<section id="home">
				<!-- 头图直接写地址，和 data.json 并行下载；data.json 的 image 仍会覆盖它 -->
				<img
					id="image"
					src="assets/images/bg.webp"
					alt=""
					width="900"
					height="600"
					fetchpriority="high"
				/>
				<img id="avatar" alt="头像" />
				<div id="info">
					<h1></h1>
					<p></p>
				</div>
				<div id="profile-links"></div>
			</section>
			<section id="about">
				<div class="item">
					<h2># 关于我</h2>
					<div id="aboutMe"></div>
					<h2># 特别感谢</h2>
					<p class="credit">
						- 图标来自:
						<a href="https://github.com/Remix-Design/RemixIcon" target="_blank">
							REMIX ICON
						</a>
					</p>
					<p class="credit">
						- 字体来自:
						<a href="https://github.com/ButTaiwan/gensen-font" target="_blank">
							源泉圆体
						</a>
					</p>
				</div>
				<div id="project" class="item">
					<h2># 项目地址</h2>
					<a
						href="https://github.com/uninto/homePage"
						target="_blank"
						rel="noopener noreferrer"
					>
						<img src="assets/images/git-repository.svg" alt="GitHub" />
						<span>uninto/homePage</span>
					</a>
				</div>
			</section>
			<section id="history">
				<div class="item">
					<ul id="history-list"></ul>
				</div>
			</section>
			<section id="sites">
				<ul id="site-list"></ul>
			</section>
		</main>
		<footer id="filing-links"></footer>
		<div id="toast" role="status" aria-live="polite" hidden></div>
		<audio preload="none" id="music-audio" loop="loop">
			<!-- 未来音乐链接可能会失效，可自行更换 -->
			<source src="https://uninto.com/runfree.mp3" />
		</audio>
	</body>
</html>
